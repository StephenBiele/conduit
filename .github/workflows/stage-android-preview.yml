name: Stage Android preview for signing

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android preview workflow run to stage
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download existing preview artifacts
        uses: actions/download-artifact@v4
        with:
          name: conduit-android-preview
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: preview-build

      - name: Stage unsigned files in a private draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          source_commit="$(gh run view "$SOURCE_RUN_ID" --json headSha --jq .headSha)"
          gh release create "conduit-preview-${SOURCE_RUN_ID}-1" \
            preview-build/apk-downloads/* preview-build/preview-tools/apksigner.jar \
            --target "$source_commit" --draft --prerelease --latest=false \
            --title "Conduit preview awaiting signing" \
            --notes 'Private staging draft. These APKs are unsigned. Sign with the persistent cloud preview key, verify, and replace unsigned assets before publishing.'
