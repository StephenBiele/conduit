name: Android preview APK

on:
  workflow_dispatch:

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build release-mode preview APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_conduitPreview: 'true'
      PREVIEW_SIGNING: ${{ secrets.ANDROID_PREVIEW_SIGNING }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Fetch rendering dependencies
        run: git submodule update --init --recursive --depth 1 third_party/katex third_party/mermaid

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app code
        run: dart run build_runner build

      - name: Generate shared code
        working-directory: packages/conduit_core
        run: dart run build_runner build

      # A fresh GitHub runner's debug key cannot update earlier installations.
      # Never silently publish APKs signed with an ephemeral key. Without the
      # repository secret, retain unsigned artifacts for signing in the cloud.
      - name: Restore persistent preview signing key
        if: env.PREVIEW_SIGNING != ''
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          signing = json.loads(os.environ['PREVIEW_SIGNING'])
          keystore = Path(os.environ['RUNNER_TEMP']) / 'conduit-preview.p12'
          keystore.write_bytes(base64.b64decode(signing['keystoreBase64'], validate=True))
          keystore.chmod(0o600)
          properties = Path('android/key.properties')
          properties.write_text(
              f'storeFile={keystore}\n'
              f'storePassword={signing["password"]}\n'
              f'keyPassword={signing["password"]}\n'
              f'keyAlias={signing["alias"]}\n'
          )
          properties.chmod(0o600)
          PY

      - name: Build optimized preview APKs
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-number "$((1000 + GITHUB_RUN_NUMBER))"

      - name: Prepare and inspect artifacts
        run: |
          mkdir -p apk-downloads preview-tools
          preview_build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          cp "$preview_build_tools/lib/apksigner.jar" preview-tools/apksigner.jar
          for abi in arm64-v8a armeabi-v7a; do
            source="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -n "$PREVIEW_SIGNING" ]; then
              "$preview_build_tools/apksigner" verify --verbose --print-certs "$source"
              destination="apk-downloads/conduit-${abi}-preview.apk"
            else
              destination="apk-downloads/conduit-${abi}-preview-unsigned.apk"
            fi
            cp "$source" "$destination"
            "$preview_build_tools/aapt" dump badging "$destination"
            "$preview_build_tools/zipalign" -c -P 16 -v 4 "$destination"
          done
          printf 'Source: %s\nMode: release\nPackage: app.cogwheel.conduit.preview\n' "$GITHUB_SHA" > apk-downloads/BUILD-INFO.txt
          (cd apk-downloads && sha256sum *.apk > SHA256SUMS)
          if [ -z "$PREVIEW_SIGNING" ]; then
            echo 'Unsigned release artifacts require the persistent cloud preview key before installation. Files are staged in a private draft release; no installable APK was published.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conduit-android-preview
          path: |
            apk-downloads/
            preview-tools/
          retention-days: 14

      - name: Stage unsigned files for cloud signing
        if: env.PREVIEW_SIGNING == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "conduit-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            apk-downloads/* preview-tools/apksigner.jar \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "Conduit preview awaiting signing" \
            --notes 'Private staging draft. These APKs are unsigned. Sign and verify with the persistent cloud preview key before publishing.'

      - name: Publish verified GitHub prerelease
        if: env.PREVIEW_SIGNING != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > /tmp/conduit-preview-notes.md <<'NOTES'
          Optimized release-mode build of Conduit's floating chat switcher.

          Download conduit-arm64-v8a-preview.apk for most Android phones. The armeabi-v7a APK is for 32-bit devices.

          Installs as **Conduit Preview**, separately from the store app and earlier debug builds. Your existing app and its data remain in place. Sign in again in the preview.

          Uses a persistent preview signing key, R8, resource shrinking, and release-mode Dart compilation. Future builds using the same key can update this preview. It cannot update older debug APKs signed with another key.
          NOTES
          gh release create "conduit-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            apk-downloads/*.apk apk-downloads/SHA256SUMS apk-downloads/BUILD-INFO.txt \
            --target "$GITHUB_SHA" --title "Conduit optimized Android preview" \
            --prerelease --latest=false --notes-file /tmp/conduit-preview-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/conduit-preview.p12"
